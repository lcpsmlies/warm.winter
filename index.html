<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>🎇💖嗨咯，你的立冬专属祝福来啦~🤗💕</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Comic Sans MS', 'Microsoft YaHei', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }
        
        body {
            background: linear-gradient(135deg, #ffecd2 0%, #fcb69f 100%);
            color: #333;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 15px;
            overflow-x: hidden;
            position: relative;
            touch-action: manipulation;
        }
        
        .container {
            max-width: 800px;
            width: 100%;
            background-color: rgba(255, 255, 255, 0.95);
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
            padding: 25px 20px;
            margin-top: 15px;
            position: relative;
            overflow: hidden;
            text-align: center;
            z-index: 10;
        }
        
        .header {
            margin-bottom: 20px;
        }
        
        h1 {
            color: #ff6b6b;
            font-size: 1.8rem;
            margin-bottom: 12px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.1);
            line-height: 1.3;
        }
        
        .greeting {
            font-size: 1.1rem;
            color: #555;
            margin-bottom: 8px;
            line-height: 1.4;
        }
        
        .subtitle {
            color: #777;
            font-size: 0.95rem;
            margin-bottom: 20px;
            line-height: 1.4;
        }
        
        .current-option {
            margin: 25px 0;
            min-height: 200px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
        
        .blind-dumplings {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 12px;
            margin: 15px 0;
        }
        
        .blind-dumpling {
            width: 65px;
            height: 65px;
            background: #ff9a3c;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.8rem;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.15);
            position: relative;
            overflow: hidden;
            touch-action: manipulation;
        }
        
        .blind-dumpling::before {
            content: "?";
            position: absolute;
            color: white;
            font-size: 1.6rem;
            font-weight: bold;
        }
        
        .blind-dumpling:active {
            transform: translateY(-3px) scale(1.05);
            background: #ff7b3c;
        }
        
        .blind-dumpling.opened {
            background: #ff6b6b;
            transform: scale(1.1);
            animation: bounce 0.5s ease;
        }
        
        .blind-dumpling.opened::before {
            display: none;
        }
        
        .dumpling-name {
            font-size: 0.75rem;
            font-weight: bold;
            color: white;
            text-align: center;
            line-height: 1.2;
            padding: 0 5px;
        }
        
        @keyframes bounce {
            0%, 100% { transform: scale(1.1); }
            50% { transform: scale(1.2); }
        }
        
        .blessing-message {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-weight: bold;
            text-shadow: 2px 2px 4px rgba(255, 255, 255, 0.9);
            z-index: 20;
            pointer-events: none;
            white-space: normal;
            font-size: 1.5rem !important;
            padding: 15px 20px;
            border-radius: 20px;
            background: rgba(255, 255, 255, 0.95);
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.2);
            animation: fadeInOut 4s ease-in-out forwards;
            text-align: center;
            max-width: 85%;
            word-wrap: break-word;
        }
        
        @keyframes fadeInOut {
            0% { opacity: 0; transform: translate(-50%, -50%) scale(0.8); }
            20% { opacity: 1; transform: translate(-50%, -50%) scale(1.1); }
            30% { transform: translate(-50%, -50%) scale(1); }
            70% { opacity: 1; transform: translate(-50%, -50%) scale(1); }
            100% { opacity: 0; transform: translate(-50%, -50%) scale(1.2); }
        }
        
        .explosion {
            position: fixed;
            font-size: 2.5rem;
            animation: explode 1.5s ease-out forwards;
            z-index: 100;
            pointer-events: none;
        }
        
        @keyframes explode {
            0% { 
                transform: scale(0.5) rotate(0deg); 
                opacity: 1; 
            }
            50% { 
                transform: scale(2) rotate(180deg); 
                opacity: 0.8;
            }
            100% { 
                transform: scale(3) rotate(360deg); 
                opacity: 0; 
            }
        }
        
        .negative-word {
            position: fixed;
            font-size: 1.3rem;
            font-weight: bold;
            color: #ff6b6b;
            z-index: 90;
            animation: wordExplode 3s ease-out forwards;
            pointer-events: none;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.2);
        }
        
        @keyframes wordExplode {
            0% {
                transform: translate(0, 0) scale(1) rotate(0deg);
                opacity: 1;
            }
            100% {
                transform: translate(var(--end-x), var(--end-y)) scale(0) rotate(360deg);
                opacity: 0;
            }
        }
        
        .snowflake {
            position: fixed;
            color: #b3e0ff;
            font-size: 1.3rem;
            user-select: none;
            z-index: 5;
            animation: snowFall linear forwards;
            pointer-events: none;
            text-shadow: 1px 1px 2px rgba(255, 255, 255, 0.5);
        }
        
        @keyframes snowFall {
            0% {
                transform: translateY(-10vh) rotate(0deg);
                opacity: 1;
            }
            100% {
                transform: translateY(110vh) rotate(360deg);
                opacity: 0;
            }
        }
        
        .warm-message {
            position: fixed;
            font-size: 1.3rem;
            color: #ff6b6b;
            font-weight: bold;
            text-shadow: 2px 2px 4px rgba(255, 255, 255, 0.9);
            z-index: 15;
            animation: warmFloat 12s ease-in-out infinite;
            pointer-events: none;
            white-space: nowrap;
        }
        
        @keyframes warmFloat {
            0%, 100% {
                transform: translate(0, 0) rotate(0deg) scale(1);
                opacity: 0.8;
            }
            25% {
                transform: translate(30px, -40px) rotate(5deg) scale(1.1);
            }
            50% {
                transform: translate(-20px, -80px) rotate(-5deg) scale(0.9);
            }
            75% {
                transform: translate(15px, -120px) rotate(3deg) scale(1.05);
            }
        }
        
        .progress-bar {
            height: 8px;
            background: #f0f0f0;
            border-radius: 4px;
            margin: 15px 0;
            overflow: hidden;
        }
        
        .progress {
            height: 100%;
            background: linear-gradient(to right, #ff9a3c, #ff6b6b);
            width: 0%;
            transition: width 0.5s ease;
        }
        
        .footer {
            margin-top: 20px;
            text-align: center;
            color: #777;
            font-style: italic;
            font-size: 0.85rem;
        }
        
        .heart {
            color: #ff6b6b;
            animation: heartbeat 1.5s infinite;
        }
        
        @keyframes heartbeat {
            0% { transform: scale(1); }
            50% { transform: scale(1.2); }
            100% { transform: scale(1); }
        }
        
        .final-message {
            font-size: 1.1rem;
            line-height: 1.6;
            margin: 15px 0;
            padding: 15px;
            background: rgba(255, 255, 255, 0.7);
            border-radius: 12px;
            display: none;
            position: relative;
        }
        
        .big-heart-container {
            position: relative;
            width: 180px;
            height: 180px;
            margin: 0 auto 20px;
            display: none;
        }
        
        .small-heart {
            position: absolute;
            font-size: 1.6rem;
            color: #ff0000;
            animation: smallHeartbeat 2s infinite;
            text-shadow: 0 0 8px rgba(255, 0, 0, 0.5);
            z-index: 25;
        }
        
        @keyframes smallHeartbeat {
            0%, 100% { transform: scale(1); }
            25% { transform: scale(1.3); }
            50% { transform: scale(1.1); }
            75% { transform: scale(1.2); }
        }
        
        .quiz-container {
            margin: 15px 0;
        }
        
        .quiz-question {
            font-size: 1.05rem;
            margin-bottom: 15px;
            color: #555;
            line-height: 1.4;
        }
        
        .quiz-options {
            display: flex;
            flex-direction: column;
            gap: 12px;
            max-width: 100%;
            margin: 0 auto;
        }
        
        .quiz-option {
            padding: 12px 15px;
            background: rgba(255, 255, 255, 0.7);
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
            border: 2px solid transparent;
            font-size: 0.95rem;
            text-align: left;
            touch-action: manipulation;
            min-height: 44px;
            display: flex;
            align-items: center;
        }
        
        .quiz-option:active {
            background: rgba(255, 154, 60, 0.3);
            border-color: #ff9a3c;
            transform: translateX(5px);
        }
        
        .selected-dumplings {
            display: flex;
            justify-content: center;
            gap: 12px;
            margin: 15px 0;
            flex-wrap: wrap;
        }
        
        .selected-dumpling {
            display: flex;
            flex-direction: column;
            align-items: center;
            animation: popIn 0.5s ease;
        }
        
        @keyframes popIn {
            0% { transform: scale(0); }
            80% { transform: scale(1.1); }
            100% { transform: scale(1); }
        }
        
        .selected-dumpling-icon {
            font-size: 2rem;
        }
        
        .selected-dumpling-name {
            font-size: 0.85rem;
            margin-top: 4px;
            color: #666;
        }
        
        .funny-message {
            font-size: 1.05rem;
            color: #ff6b6b;
            margin: 12px 0;
            font-style: italic;
            animation: funnyPulse 2s infinite;
            line-height: 1.4;
        }
        
        @keyframes funnyPulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.03); }
        }
        
        .letter-container {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(255, 255, 255, 0.98);
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.2);
            z-index: 30;
            max-width: 90%;
            width: 380px;
            display: none;
            text-align: left;
            line-height: 1.5;
            max-height: 80vh;
            overflow-y: auto;
        }
        
        .letter-content {
            font-size: 0.95rem;
            color: #555;
        }
        
        .letter-signature {
            text-align: right;
            margin-top: 15px;
            font-style: italic;
            color: #ff6b6b;
        }
        
        .close-letter {
            position: absolute;
            top: 8px;
            right: 12px;
            font-size: 1.3rem;
            cursor: pointer;
            color: #ff6b6b;
            width: 30px;
            height: 30px;
            display: flex;
            align-items: center;
            justify-content: center;
            touch-action: manipulation;
        }
        
        button {
            background: #ff9a3c;
            color: white;
            border: none;
            padding: 12px 25px;
            border-radius: 20px;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.3s ease;
            touch-action: manipulation;
            min-height: 44px;
            margin: 10px 0;
            width: 100%;
            max-width: 300px;
        }
        
        button:active {
            transform: scale(0.98);
            background: #ff8a2c;
        }
        
        /* 音乐控制按钮样式 */
        .music-control {
            position: fixed;
            top: 15px;
            right: 15px;
            z-index: 100;
            background: rgba(255, 255, 255, 0.9);
            border-radius: 50%;
            width: 45px;
            height: 45px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.15);
            cursor: pointer;
            touch-action: manipulation;
        }
        
        .music-control i {
            font-size: 1.3rem;
            color: #ff6b6b;
        }
        
        .music-control.playing i {
            animation: musicNote 1.5s infinite;
        }
        
        @keyframes musicNote {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.2); }
        }
        
        /* 超小屏幕适配 */
        @media (max-width: 360px) {
            .container {
                padding: 15px 12px;
            }
            
            h1 {
                font-size: 1.6rem;
            }
            
            .greeting {
                font-size: 1rem;
            }
            
            .blind-dumpling {
                width: 55px;
                height: 55px;
                font-size: 1.6rem;
            }
            
            .blind-dumpling::before {
                font-size: 1.4rem;
            }
            
            .big-heart-container {
                width: 160px;
                height: 160px;
            }
            
            .small-heart {
                font-size: 1.4rem;
            }
            
            .music-control {
                width: 40px;
                height: 40px;
                top: 10px;
                right: 10px;
            }
            
            .letter-container {
                width: 95%;
                padding: 15px;
            }
        }
        
        /* 横屏适配 */
        @media (max-height: 500px) and (orientation: landscape) {
            .container {
                padding: 15px;
                margin-top: 5px;
            }
            
            .header {
                margin-bottom: 10px;
            }
            
            h1 {
                font-size: 1.4rem;
                margin-bottom: 8px;
            }
            
            .current-option {
                margin: 15px 0;
                min-height: 150px;
            }
            
            .blind-dumplings {
                gap: 8px;
            }
            
            .blind-dumpling {
                width: 45px;
                height: 45px;
                font-size: 1.4rem;
            }
            
            .blind-dumpling::before {
                font-size: 1.2rem;
            }
        }
        
        /* 防止文本选择 */
        .no-select {
            -webkit-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
            user-select: none;
        }
    </style>
</head>

    <!-- 音频元素 - 使用本地音乐文件 -->

        <source src="winter_music.mp3" type="audio/mpeg">
        您的浏览器不支持音频元素。

    <script>
        // 游戏状态
        let currentStep = 0;
        const totalSteps = 3;
        let selectedDumplings = [];
        let musicStarted = false;
        let isMusicPlaying = false;
        
        // 获取音乐相关元素
        const backgroundMusic = document.getElementById('background-music');
        const musicControl = document.getElementById('music-control');
        
        // 负面词汇用于爆炸效果
        const negativeWords = [
            "不开心", "不如意", "烦恼", "臭领导", "压力",
            "焦虑", "郁闷", "沮丧", "疲惫", "困扰",
            "加班", "失落", "臭同事", "熬夜", "失望"
        ];
        
        // 初始化音乐控制
        function initMusicControl() {
            musicControl.addEventListener('click', function() {
                if (isMusicPlaying) {
                    backgroundMusic.pause();
                    musicControl.classList.remove('playing');
                    isMusicPlaying = false;
                } else {
                    // 确保音频在用户交互后播放
                    backgroundMusic.play().then(() => {
                        musicControl.classList.add('playing');
                        isMusicPlaying = true;
                        musicStarted = true;
                    }).catch(error => {
                        console.log("音频播放失败:", error);
                        // 如果直接播放失败，尝试使用用户交互后播放
                        document.addEventListener('click', function startMusicOnce() {
                            backgroundMusic.play().then(() => {
                                musicControl.classList.add('playing');
                                isMusicPlaying = true;
                                musicStarted = true;
                            });
                            document.removeEventListener('click', startMusicOnce);
                        });
                    });
                }
            });
            
            // 自动播放音乐（需要用户交互后）
            document.addEventListener('click', function startMusicOnInteraction() {
                if (!musicStarted) {
                    backgroundMusic.play().then(() => {
                        musicControl.classList.add('playing');
                        isMusicPlaying = true;
                        musicStarted = true;
                    }).catch(error => {
                        console.log("自动播放失败，等待用户交互:", error);
                    });
                    // 移除事件监听器，只执行一次
                    document.removeEventListener('click', startMusicOnInteraction);
                }
            });
        }
        
        // 饺子数据 - 每个饺子只有一行祝福语

        // 温暖幽默消息

                ],
                responses: [
                    "火锅最热闹，你想想吃什么好呢🎊",
                    "糖葫芦甜甜蜜蜜，啦啦啦分泌快乐的多巴胺🥰",
                    "烤红薯暖心暖胃，不让你饿着啦~🌟",
                    "姜茶驱寒暖心，好适合冬天的你哦~🤗"
                ]
            },
            {
                question: "憨豆豆冬天最需要什么？",
                options: [
                    "厚厚的羽绒服🧥",
                    "暖暖的围巾手套🧤",
                    "热乎乎的茶❤️",
                    "我的暖心陪伴🔥"
                ],
                responses: [
                    "羽绒服保暖，但不如我的祝福暖😎",
                    "围巾手套很实用，但我的关心更贴心🌟",
                    "茶暖手，我的祝福暖心😊",
                    "这个选择最让我开心🥰"
                ]
            }
        ];
        
        // 初始化页面
        function initPage() {
            initMusicControl();
            showBlindDumplings();
            startEffects();
        }
        
        // 开始视觉效果
        function startEffects() {
            // 定期创建雪花
            setInterval(createSnowflake, 500);
            
            // 定期创建温暖消息
            setInterval(createWarmMessage, 3000);
            
            // 定期创建爆炸效果
            setInterval(() => {
                if (Math.random() > 0.7) {
                    createRandomExplosion();
                }
            }, 2000);
        }
        
        // 创建随机爆炸效果
        function createRandomExplosion() {
            const x = Math.random() * window.innerWidth;
            const y = Math.random() * window.innerHeight;
            createExplosion(x, y);
        }
        
        // 更新进度条
        function updateProgress() {
            const progress = document.getElementById('progress');
            const percentage = (currentStep / totalSteps) * 100;
            progress.style.width = percentage + '%';
        }
        
        // 创建祝福消息（在页面中央显示）
        function createBlessingMessage(text, color) {
            const message = document.createElement('div');
            message.className = 'blessing-message';
            message.textContent = text;
            message.style.color = color;
            message.style.border = `3px solid ${color}`;
            
            document.body.appendChild(message);
            
            setTimeout(() => {
                if (message.parentNode) {
                    message.parentNode.removeChild(message);
                }
            }, 4000);
        }
        
        // 创建负面词汇爆炸效果
        function createNegativeWordExplosion() {
            // 创建多个负面词汇
            for (let i = 0; i < 20; i++) {
                setTimeout(() => {
                    const word = document.createElement('div');
                    word.className = 'negative-word';
                    word.textContent = negativeWords[Math.floor(Math.random() * negativeWords.length)];
                    
                    // 随机位置
                    const centerX = window.innerWidth / 2;
                    const centerY = window.innerHeight / 2;
                    
                    // 随机结束位置
                    const angle = Math.random() * Math.PI * 2;
                    const distance = 200 + Math.random() * 300;
                    const endX = Math.cos(angle) * distance;
                    const endY = Math.sin(angle) * distance;
                    
                    word.style.left = centerX + 'px';
                    word.style.top = centerY + 'px';
                    word.style.setProperty('--end-x', endX + 'px');
                    word.style.setProperty('--end-y', endY + 'px');
                    
                    // 随机颜色
                    const colors = ['#ff6b6b', '#ff9a3c', '#ff0000', '#8b0000', '#b22222'];
                    word.style.color = colors[Math.floor(Math.random() * colors.length)];
                    
                    // 随机大小
                    word.style.fontSize = (Math.random() * 10 + 20) + 'px';
                    
                    document.body.appendChild(word);
                    
                    // 3秒后移除
                    setTimeout(() => {
                        if (word.parentNode) {
                            word.parentNode.removeChild(word);
                        }
                    }, 3000);
                    
                }, i * 100);
            }
        }
        
        // 获取随机颜色
        function getRandomColor() {
            const colors = ['#ff6b6b', '#ff9a3c', '#ffd166', '#06d6a0', '#118ab2', '#ef476f', '#7209b7', '#3a86ff'];
            return colors[Math.floor(Math.random() * colors.length)];
        }
        
        // 创建爆炸效果
        function createExplosion(x, y) {
            const explosion = document.createElement('div');
            explosion.className = 'explosion';
            explosion.innerHTML = '💥';
            explosion.style.left = x + 'px';
            explosion.style.top = y + 'px';
            explosion.style.color = getRandomColor();
            
            document.body.appendChild(explosion);
            
            setTimeout(() => {
                if (explosion.parentNode) {
                    explosion.parentNode.removeChild(explosion);
                }
            }, 1500);
        }
        
        // 创建雪花（满屏飘动）
        function createSnowflake() {
            const snowflake = document.createElement('div');
            snowflake.className = 'snowflake';
            snowflake.innerHTML = '❄';
            snowflake.style.left = Math.random() * 100 + 'vw';
            snowflake.style.fontSize = (Math.random() * 15 + 12) + 'px';
            snowflake.style.opacity = Math.random() * 0.7 + 0.3;
            snowflake.style.animationDuration = (Math.random() * 5 + 5) + 's';
            snowflake.style.color = `rgba(179, 224, 255, ${Math.random() * 0.5 + 0.5})`;
            
            document.body.appendChild(snowflake);
            
            setTimeout(() => {
                if (snowflake.parentNode) {
                    snowflake.parentNode.removeChild(snowflake);
                }
            }, 10000);
        }
        
        // 创建温暖消息（满屏飘动）
        function createWarmMessage() {
            const message = document.createElement('div');
            message.className = 'warm-message';
            message.textContent = warmMessages[Math.floor(Math.random() * warmMessages.length)];
            message.style.left = Math.random() * 80 + 10 + '%';
            message.style.top = Math.random() * 80 + 10 + '%';
            message.style.animationDuration = (Math.random() * 8 + 8) + 's';
            message.style.color = getRandomColor();
            message.style.fontSize = (Math.random() * 0.3 + 1.4) + 'rem';
            
            document.body.appendChild(message);
            
            setTimeout(() => {
                if (message.parentNode) {
                    message.parentNode.removeChild(message);
                }
            }, 12000);
        }
        
        // 创建小心心组成的大爱心
        function createBigHeart() {
            const container = document.getElementById('big-heart-container');
            container.style.display = 'block';
            container.innerHTML = '';
            
            // 心形坐标算法
            const heartPoints = [];
            const numPoints = 60;
            
            for (let i = 0; i < numPoints; i++) {
                const t = i / numPoints * 2 * Math.PI;
                const x = 16 * Math.pow(Math.sin(t), 3);
                const y = 13 * Math.cos(t) - 5 * Math.cos(2*t) - 2 * Math.cos(3*t) - Math.cos(4*t);
                
                heartPoints.push({
                    x: (x + 16) / 32 * 200,
                    y: (-y + 13) / 26 * 200
                });
            }
            
            // 创建小心心
            heartPoints.forEach((point, index) => {
                setTimeout(() => {
                    const heart = document.createElement('div');
                    heart.className = 'small-heart';
                    heart.innerHTML = '❤';
                    heart.style.left = point.x + 'px';
                    heart.style.top = point.y + 'px';
                    heart.style.animationDelay = (index * 0.03) + 's';
                    heart.style.color = '#ff0000';
                    
                    container.appendChild(heart);
                    
                    if (index === numPoints - 1) {
                        setTimeout(showLetter, 500);
                    }
                }, index * 30);
            });
        }
        
        // 显示信件
        function showLetter() {
            const letterContainer = document.getElementById('letter-container');
            const letterContent = document.getElementById('letter-content');
            
            letterContent.innerHTML = `
                <p>嗨，憨豆豆🎄：</p>
                <p style="margin-top:12px;">希望这个小玩意能给你带来一些温暖和欢乐🤗🤗</p>
                <p style="margin-top:12px;">每当听到你笑，我的心里就像这满屏的爱心一样，充满了温暖🥰🥰。</p>
                <p style="margin-top:12px;">你是一个特别的人，总是能让我想和你分享所有美好🤩🤩</p>
                <p style="margin-top:12px;">愿这个冬天，我的祝福能像这些跳动的心一样，</p>
                <p>一直陪伴着你，温暖你的每一天🙌🙌。</p>
                <p style="margin-top:12px;">记住，无论什么时候，你在我心中都是最棒最棒的！</p>
                <p>你是我心里最厉害的人，永远都站在你这边支持你😎😎</p>
                <p style="margin-top:12px;">愿你整个冬天都温暖、幸运、如愿以偿！</p>
                <div class="letter-signature">
                    <p>我会永远陪着你的哦~💖💖</p>
                    <p>${new Date().getFullYear()}年立冬</p>
                </div>
            `;
            
            letterContainer.style.display = 'block';
            
            // 添加关闭信件的事件
            document.getElementById('close-letter').addEventListener('click', function() {
                letterContainer.style.display = 'none';
            });
            
            // 点击背景也可以关闭
            letterContainer.addEventListener('click', function(e) {
                if (e.target === this) {
                    this.style.display = 'none';
                }
            });
        }
        
        // 显示盲盒饺子
        function showBlindDumplings() {
            const currentOption = document.getElementById('current-option');
            currentOption.innerHTML = `
                <h2 style="color:#ff6b6b; margin-bottom:15px; font-size:1.3rem;">🥟 第一步：惊喜饺子盲盒</h2>
                <p style="margin-bottom:12px; font-size:0.95rem;">立冬不吃饺，冻掉耳朵没人管！</p>
                <p style="margin-bottom:12px; font-size:0.95rem;">选3个饺子，看看有什么惊喜等着你~</p>
                <div class="blind-dumplings">
                    ${dumplings.map((_, index) => `
                        <div class="blind-dumpling" data-index="${index}"></div>
                    `).join('')}
                </div>
                <div style="margin-top:15px; font-size:0.95rem; color:#666;">
                    已选择: ${selectedDumplings.length}/3
                </div>
                <div class="funny-message">选一个吧，保证让你笑出声！</div>
            `;
            
            // 添加盲盒点击事件
            document.querySelectorAll('.blind-dumpling').forEach(dumpling => {
                dumpling.addEventListener('click', function() {
                    if (this.classList.contains('opened')) return;
                    
                    const index = parseInt(this.getAttribute('data-index'));
                    const selectedDumpling = dumplings[index];
                    
                    // 标记为已打开
                    this.classList.add('opened');
                    
                    // 显示饺子馅的名称
                    this.innerHTML = `<div class="dumpling-name">${selectedDumpling.name}</div>`;
                    
                    // 添加到已选择列表
                    selectedDumplings.push(selectedDumpling);
                    
                    // 显示祝福消息在页面中央
                    createBlessingMessage(
                        selectedDumpling.message,
                        selectedDumpling.color
                    );
                    
                    // 更新选择计数
                    document.querySelector('.blind-dumplings + div').textContent = 
                        `已选择: ${selectedDumplings.length}/3`;
                    
                    // 如果选择了3个，进入下一步
                    if (selectedDumplings.length === 3) {
                        setTimeout(showSelectedDumplings, 4000);
                    }
                });
            });
        }
        
        // 显示已选择的饺子
        function showSelectedDumplings() {
            const currentOption = document.getElementById('current-option');
            currentOption.innerHTML = `
                <h2 style="color:#ff6b6b; margin-bottom:15px; font-size:1.3rem;">🎉 饺子选择完成！</h2>
                <p style="margin-bottom:12px; font-size:0.95rem;">你选择了这些美味的饺子：</p>
                <div class="selected-dumplings">
                    ${selectedDumplings.map(dumpling => `
                        <div class="selected-dumpling">
                            <div class="selected-dumpling-icon">${dumpling.icon}</div>
                            <div class="selected-dumpling-name">${dumpling.name}</div>
                        </div>
                    `).join('')}
                </div>
                <div class="funny-message">吃饱了吗？现在来玩个趣味问答吧！</div>
                <button id="next-to-bomb">
                    下一步：啦啦啦~让我瞅瞅你想干嘛 💭
                </button>
            `;
            
            document.getElementById('next-to-bomb').addEventListener('click', function() {
                currentStep = 1;
                updateProgress();
                showFunQuiz();
            });
        }
        
        // 显示趣味问答
        function showFunQuiz() {
            const currentOption = document.getElementById('current-option');
            currentOption.innerHTML = `
                <h2 style="color:#ff9a3c; margin-bottom:15px; font-size:1.3rem;">💭 第二步：趣味问答</h2>
                <p style="margin-bottom:12px; font-size:0.95rem;">选你喜欢的答案，每个选择都有惊喜！</p>
                <div class="quiz-container">
                    <div class="quiz-question" id="quiz-question">${quizQuestions[0].question}</div>
                    <div class="quiz-options" id="quiz-options">
                        ${quizQuestions[0].options.map((option, index) => `
                            <div class="quiz-option" data-index="${index}">${option}</div>
                        `).join('')}
                    </div>
                </div>
                <div style="margin-top:15px; font-size:0.95rem; color:#666;" id="quiz-progress">
                    哇哦，我知道啦~1/3
                </div>
                <div class="funny-message" id="funny-response"></div>
            `;
            
            let currentQuestion = 0;
            
            // 添加选项点击事件
            document.querySelectorAll('.quiz-option').forEach(option => {
                option.addEventListener('click', function() {
                    const selectedIndex = parseInt(this.getAttribute('data-index'));
                    
                    // 显示对应的趣味回应
                    document.getElementById('funny-response').textContent = 
                        quizQuestions[currentQuestion].responses[selectedIndex];
                    
                    // 给选中的选项添加效果
                    this.style.background = '#c8f7c5';
                    this.style.borderColor = '#06d6a0';
                    
                    // 禁用所有选项
                    document.querySelectorAll('.quiz-option').forEach(opt => {
                        opt.style.pointerEvents = 'none';
                    });
                    
                    // 进入下一题或结束
                    setTimeout(() => {
                        currentQuestion++;
                        if (currentQuestion < quizQuestions.length) {
                            updateQuizQuestion(currentQuestion);
                        } else {
                            currentStep = 2;
                            updateProgress();
                            showBombExplosion();
                        }
                    }, 2000);
                });
            });
            
            function updateQuizQuestion(questionIndex) {
                document.getElementById('quiz-question').textContent = 
                    quizQuestions[questionIndex].question;
                
                document.getElementById('quiz-options').innerHTML = 
                    quizQuestions[questionIndex].options.map((option, index) => `
                        <div class="quiz-option" data-index="${index}">${option}</div>
                    `).join('');
                
                document.getElementById('quiz-progress').textContent = 
                    `问题 ${questionIndex + 1}/3`;
                
                document.getElementById('funny-response').textContent = '';
                
                // 重新添加事件监听
                document.querySelectorAll('.quiz-option').forEach(option => {
                    option.addEventListener('click', function() {
                        const selectedIndex = parseInt(this.getAttribute('data-index'));
                        
                        document.getElementById('funny-response').textContent = 
                            quizQuestions[questionIndex].responses[selectedIndex];
                        
                        this.style.background = '#c8f7c5';
                        this.style.borderColor = '#06d6a0';
                        
                        document.querySelectorAll('.quiz-option').forEach(opt => {
                            opt.style.pointerEvents = 'none';
                        });
                        
                        // 进入下一题或结束
                        setTimeout(() => {
                            currentQuestion++;
                            if (currentQuestion < quizQuestions.length) {
                                updateQuizQuestion(currentQuestion);
                            } else {
                                currentStep = 2;
                                updateProgress();
                                showBombExplosion();
                            }
                        }, 2000);
                    });
                });
            }
        }
        
        // 显示爆炸效果页面
        function showBombExplosion() {
            const currentOption = document.getElementById('current-option');
            currentOption.innerHTML = `
                <h2 style="color:#7209b7; margin-bottom:15px; font-size:1.3rem;">💥 第三步：欢乐大爆炸！</h2>
                <p style="margin-bottom:12px; font-size:0.95rem;">点击炸弹，炸掉所有不开心不如意！</p>
                <div class="funny-message">让快乐充满整个屏幕吧！</div>
                <button id="bomb-button" style="font-size: 2.5rem; padding: 20px; background: #ff6b6b; border-radius: 50%; width: 90px; height: 90px; display: flex; align-items: center; justify-content: center; margin: 20px auto;">
                    💣
                </button>
                <button id="finish-button">
                    啦啦啦~还有最终惊喜 🎁
                </button>
            `;
            
            // 添加炸弹点击事件
            document.getElementById('bomb-button').addEventListener('click', function() {
                // 创建爆炸效果
                createExplosion(window.innerWidth/2, window.innerHeight/2);
                
                // 创建负面词汇爆炸效果
                createNegativeWordExplosion();
                
                // 添加多个随机爆炸效果
                for (let i = 0; i < 10; i++) {
                    setTimeout(() => {
                        createRandomExplosion();
                    }, i * 200);
                }
            });
            
            // 完成按钮
            document.getElementById('finish-button').addEventListener('click', function() {
                currentStep = 3;
                updateProgress();
                showFinalSurprise();
            });
        }
        
        // 显示最终惊喜
        function showFinalSurprise() {
            const currentOption = document.getElementById('current-option');
            currentOption.innerHTML = '';
            
            const finalMessage = document.getElementById('final-message');
            finalMessage.style.display = 'block';
            finalMessage.innerHTML = `
                <h2 style="color:#ff6b6b; margin-bottom:15px; font-size:1.4rem;">🎁 最终惊喜来啦~</h2>
                <p style="margin-bottom:12px;">憨豆豆🎄，这个冬天因为有你会格外温暖！</p>
                <p style="margin-bottom:12px;">愿我的祝福像这满屏的爱心一样，</p>
                <p>永远围绕着你，温暖你的整个冬天🌟🌟 </p>
                <div class="funny-message">快点下面按钮看看终极礼物吧！🤩🤩</div>
                <button id="heart-button">
                    接收爱心礼物 💝
                </button>
            `;
            
            document.getElementById('heart-button').addEventListener('click', function() {
                createBigHeart();
                finalMessage.style.display = 'none';
            });
        }
        
        // 页面加载完成后初始化
        window.addEventListener('DOMContentLoaded', initPage);
    </script>
</body>
</html>
